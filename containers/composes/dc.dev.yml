services:
  server:
    build:
      context: ../..
      dockerfile: containers/images/Dockerfile
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "10"
    ports:
      - "8080:8080"
    command: ["--addr", ":8080"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      - turn

  turn:
    image: coturn/coturn:latest
    restart: always
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
    command: >
      -n
      --log-file=stdout
      --user=user:password
      --realm=videochat
      --min-port=49152
      --max-port=65535
