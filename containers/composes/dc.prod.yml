services:
  server:
    build:
      context: ../..
      dockerfile: containers/images/Dockerfile
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "10"
    ports:
      - "8080:8080"
    command: ["--addr", ":8080"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      - turn
    environment:
      - PORT=8080

  turn:
    image: coturn/coturn:latest
    restart: always
    network_mode: host
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    # TURN credentials must match the ICE servers configured in the browser JS.
    # Override TURN_USER and TURN_PASS via a .env file or environment variables.
    command: >
      -n
      --log-file=stdout
      --user=${TURN_USER:-user}:${TURN_PASS:-password}
      --realm=${TURN_REALM:-videochat}
      --min-port=49152
      --max-port=65535
      --no-stun
